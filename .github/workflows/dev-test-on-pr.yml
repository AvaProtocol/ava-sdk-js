name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: "Docker Image Tag of avaprotocol/avs-dev"
        required: false
        default: "latest"

# Shared env for all jobs that need secrets
env:
  TEST_ENV: "dev"
  DOCKER_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.docker_image_tag || 'latest' }}

jobs:
  # ── Job 1: Check if tests should run ──────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source or test code changes
        id: check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          SOURCE_PATTERN='^(packages/sdk-js/src|packages/types/src|tests/|config/|docker-compose\.yml|jest\.config\.cjs|\.github/workflows/)'
          MATCHING_FILES=$(echo "$CHANGED_FILES" | grep -E "$SOURCE_PATTERN" || echo "")

          if [ -z "$MATCHING_FILES" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No source/test changes detected, skipping tests"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            echo "$MATCHING_FILES"
          fi

      - name: Always run for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "should_run=true" >> $GITHUB_OUTPUT
        id: dispatch_check

      # Merge outputs: workflow_dispatch always runs, PR only if source changed
      - name: Resolve should_run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=${{ steps.check.outputs.should_run || 'true' }}" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Parallel test suites ───────────────────────────────────
  e2e-tests:
    name: "E2E / ${{ matrix.suite }}"
    needs: setup
    if: needs.setup.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static MA v2 salt per shard so parallel UserOps do not share
          # an EntryPoint nonce (#263). Must stay inside 0/1/2.
          - suite: core
            funded_salt: "0"
          - suite: workflows
            funded_salt: "0"
          - suite: executions
            funded_salt: "1"
          - suite: triggers
            funded_salt: "0"
          - suite: nodes
            funded_salt: "2"
          - suite: templates
            funded_salt: "0"

    env:
      # The gateway/worker run in containers, so a stub server bound on the
      # runner host is not reachable at 127.0.0.1 from their point of view.
      # docker-compose maps this name to the host (extra_hosts + host-gateway);
      # tests/utils/stubServer.ts builds its base URL from it.
      TEST_STUB_HOST: host.docker.internal
      # Wins over Jest testPath inference in fundedWalletSalt().
      FUNDED_WALLET_SALT: ${{ matrix.funded_salt }}
      # Secrets
      TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
      ECDSA_PRIVATE_KEY: ${{ secrets.ECDSA_PRIVATE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TENDERLY_ACCESS_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
      CONTROLLER_PRIVATE_KEY: ${{ secrets.CONTROLLER_PRIVATE_KEY }}
      AP_NOTIFY_BOT_TOKEN: ${{ secrets.AP_NOTIFY_BOT_TOKEN }}
      MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
      GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
      GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
      SENDGRID_KEY: ${{ secrets.SENDGRID_KEY }}
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      ETH_WS_URL: ${{ secrets.ETH_WS_URL }}
      CHAIN_ENDPOINT: ${{ secrets.CHAIN_ENDPOINT }}
      CONTEXT_MEMORY_API_KEY: ${{ secrets.CONTEXT_MEMORY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Variables
      TENDERLY_ACCOUNT: ${{ vars.TENDERLY_ACCOUNT }}
      TENDERLY_PROJECT: ${{ vars.TENDERLY_PROJECT }}
      THEGRAPH_API_KEY: ${{ vars.THEGRAPH_API_KEY }}
      # Required: E2E stack uses Alchemy (production path). Missing key fails closed.
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      # Registered test operator (raw-JSON keystores + passwords) so on-chain
      # (block/event) triggers actually fire in the E2E stack.
      OPERATOR_ECDSA_KEYSTORE: ${{ secrets.OPERATOR_ECDSA_KEYSTORE }}
      OPERATOR_BLS_KEYSTORE: ${{ secrets.OPERATOR_BLS_KEYSTORE }}
      OPERATOR_ECDSA_KEY_PASSWORD: ${{ secrets.OPERATOR_ECDSA_KEY_PASSWORD }}
      OPERATOR_BLS_KEY_PASSWORD: ${{ secrets.OPERATOR_BLS_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build SDK
        run: yarn build

      - name: Inject secrets into gateway + worker configs
        run: |
          export TEST_ENV ETH_RPC_URL ETH_WS_URL ECDSA_PRIVATE_KEY JWT_SECRET ALCHEMY_API_KEY CONTROLLER_PRIVATE_KEY TENDERLY_ACCOUNT TENDERLY_PROJECT TENDERLY_ACCESS_KEY AP_NOTIFY_BOT_TOKEN SENDGRID_KEY THEGRAPH_API_KEY MORALIS_API_KEY GOPLUS_APP_KEY GOPLUS_APP_SECRET CONTEXT_MEMORY_API_KEY
          for src in gateway worker-sepolia operator-sepolia; do
            envsubst < config/${src}.yaml > config/${src}.runtime.yaml
            echo "Generated config/${src}.runtime.yaml: $(wc -l < config/${src}.runtime.yaml) lines"
            if grep -vE '^\s*#' config/${src}.runtime.yaml | grep -q '\${'; then
              echo "WARNING: Found unsubstituted variables in ${src}.runtime.yaml:"
              grep -vE '^\s*#' config/${src}.runtime.yaml | grep '\${'
            else
              echo "All variables substituted correctly in ${src}.runtime.yaml."
            fi
          done

      - name: Start gateway
        run: |
          docker compose up -d gateway
          echo "Waiting for gateway to start..."
          sleep 10
          docker compose ps
          docker compose logs gateway --tail=20

      - name: Wait for gateway health
        run: |
          max_attempts=24
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl --output /dev/null --silent --fail --max-time 5 http://localhost:8080/up; then
              echo "Gateway is ready!"
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: not ready yet..."
            docker compose logs gateway --tail=5
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "Gateway failed to start"
            docker compose ps
            docker compose logs gateway
            exit 1
          fi

      - name: Start worker-sepolia
        run: |
          docker compose up -d worker-sepolia
          echo "Waiting for worker-sepolia to start..."
          sleep 5
          docker compose ps
          docker compose logs worker-sepolia --tail=20

      - name: Wait for worker-sepolia health
        run: |
          max_attempts=24
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl --output /dev/null --silent --fail --max-time 5 http://localhost:8090/health; then
              echo "Worker-sepolia is ready!"
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: worker not ready yet..."
            docker compose logs worker-sepolia --tail=5
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "Worker-sepolia failed to start"
            docker compose ps
            docker compose logs worker-sepolia
            exit 1
          fi

      - name: Write operator keystores
        run: |
          mkdir -p config/.operator-keys
          # Keystores are stored as raw JSON secrets and written verbatim.
          printf '%s' "$OPERATOR_ECDSA_KEYSTORE" > config/.operator-keys/operator.ecdsa.key.json
          printf '%s' "$OPERATOR_BLS_KEYSTORE"   > config/.operator-keys/operator.bls.key.json
          echo "ECDSA keystore: $(wc -c < config/.operator-keys/operator.ecdsa.key.json) bytes; BLS keystore: $(wc -c < config/.operator-keys/operator.bls.key.json) bytes"
          # Sanity-check shape (no secret values printed) so a bad secret fails here, clearly.
          jq -e '.address and .crypto' config/.operator-keys/operator.ecdsa.key.json > /dev/null && echo "ECDSA keystore JSON valid"
          jq -e '.pubKey and .crypto'  config/.operator-keys/operator.bls.key.json  > /dev/null && echo "BLS keystore JSON valid"

      - name: Start operator
        run: |
          docker compose up -d operator
          echo "Waiting for operator to authenticate with the aggregator..."
          max_attempts=24
          attempt=0
          ready=false
          while [ $attempt -lt $max_attempts ]; do
            # Hard-fail fast if the operator crashed (e.g. not registered,
            # keystore/password mismatch) — it won't recover on its own. Use -a
            # so an already-exited container is still listed (plain `ps` hides it,
            # which would let a crash slip past this check).
            if docker compose ps -a operator | grep -qiE "exit|dead"; then
              echo "Operator container exited unexpectedly:"
              docker compose ps -a operator
              docker compose logs operator
              docker compose logs gateway --tail=80
              exit 1
            fi
            # "Operator ready" only means the process started. After EigenLayer-AVS
            # #767 the aggregator refuses unauthenticated Node RPCs, so a connected
            # but unauthenticated operator still yields "no connected operator
            # currently monitors chain_id=11155111" on every block/event create.
            # Auth refusal will not recover without a config change — fail fast.
            if docker compose logs operator 2>&1 | grep -q "operator authentication required"; then
              echo "Operator reached the aggregator but was refused (operator authentication required)."
              echo "config/operator-sepolia.yaml operator_address must be EIP-55 checksummed"
              echo "to match the address the operator signs into its gRPC Authorization header."
              docker compose logs operator --tail=80
              docker compose logs gateway --tail=80
              exit 1
            fi
            if docker compose logs operator 2>&1 | grep -q "Successfully pinged aggregator"; then
              echo "Operator is authenticated and pinging the aggregator."
              ready=true
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: operator not authenticated yet..."
            docker compose logs operator --tail=5
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ "$ready" != "true" ]; then
            echo "Operator never authenticated after $((max_attempts * 5))s"
            docker compose ps -a
            docker compose logs operator
            docker compose logs gateway --tail=80
            exit 1
          fi
          # Give the aggregator a moment to register the operator connection
          # (operator notifications batch every ~3s) before tests create tasks.
          sleep 5
          docker compose ps
          docker compose logs operator --tail=30

      - name: Generate AVS API key
        run: |
          # IMPORTANT: -T disables TTY allocation. Without it, docker compose exec
          # converts \n to \r\n on stdout, so the captured API key gets a trailing
          # \r and the gateway rejects it as "API key invalid".
          #
          # Binary name depends on the image: avaprotocol/avs-dev:latest still
          # ships /ava; the EigenLayer-AVS source Dockerfile renamed it to
          # /app/ap (ENTRYPOINT ["./ap"]). Detect whichever the running
          # container actually has.
          BIN=$(docker compose exec -T gateway sh -c 'if [ -x /ava ]; then echo /ava; elif [ -x /app/ap ]; then echo /app/ap; else echo ./ap; fi' | tr -d '\r')
          echo "Using gateway binary: $BIN"
          API_KEY=$(docker compose exec -T gateway "$BIN" create-api-key --config /app/config/gateway.runtime.yaml --role=admin --subject=0x804e49e8C4eDb560AE7c48B554f6d2e27Bb81557)
          echo "AVS_API_KEY=$API_KEY" >> $GITHUB_ENV
          echo "API key generated (${#API_KEY} chars)"

      - name: "Run test:${{ matrix.suite }}"
        run: yarn test:${{ matrix.suite }}

      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose ps -a
          echo "::endgroup::"
          echo "::group::gateway logs"
          docker compose logs gateway --tail=120
          echo "::endgroup::"
          echo "::group::worker-sepolia logs"
          docker compose logs worker-sepolia --tail=80
          echo "::endgroup::"
          echo "::group::operator logs"
          docker compose logs operator --tail=120
          echo "::endgroup::"

  # ── Job 3: Lint + unit smoke (no docker stack) ────────────────────
  smoke:
    name: Lint + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build SDK
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Smoke + on-chain helper unit tests
        run: yarn test:smoke

  # ── Job 4: Report results ─────────────────────────────────────────
  report:
    name: Report
    needs: [setup, e2e-tests, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Lint/smoke failed. Check the Lint + smoke job." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "${{ needs.setup.outputs.should_run }}" = "false" ]; then
            echo "E2E tests skipped — no source/test changes detected. Lint/smoke passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ needs.e2e-tests.result }}" = "success" ]; then
            echo "All test suites passed." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" = "skipped" ]; then
            echo "E2E tests were skipped. Lint/smoke passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some test suites failed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
